<style>

.storyInfo{

}

.storyUser{
  font-weight:bold;

.storyDate{
  font-size:12px;

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="loginBox">

    <h1>Mi Chat Admin</h1>

    <p>
      Panel privado de administración
    </p>

    <input
      id="username"
      type="text"
      placeholder="Usuario administrador"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="current-password"
    >

    <button
      class="loginButton"
      onclick="login()"
    >
      Entrar
    </button>

    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</div>


<!-- ADMIN -->

<div
  id="adminScreen"
  class="hidden"
>

  <header class="header">

    <h1>Mi Chat Admin</h1>

    <button
      class="logoutButton"
      onclick="logout()"
    >
      Cerrar sesión
    </button>

  </header>


  <main class="container">

    <!-- ESTADÍSTICAS -->

    <div class="stats">

      <div class="stat">
        <div class="statTitle">
          Usuarios
        </div>
        <div
          id="statUsers"
          class="statValue"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div class="statTitle">
          Mensajes
        </div>
        <div
          id="statMessages"
          class="statValue"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div class="statTitle">
          Estados activos
        </div>
        <div
          id="statStories"
          class="statValue"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div class="statTitle">
          Usuarios conectados
        </div>
        <div
          id="statOnline"
          class="statValue"
        >
          0
        </div>
      </div>

    </div>


    <!-- USUARIOS -->

    <section class="section">

      <div class="sectionHeader">

        <h2>Usuarios</h2>

        <button
          class="refresh"
          onclick="loadUsers()"
        >
          Actualizar
        </button>

      </div>

      <div
        id="users"
        class="users"
      >
        <div class="empty">
          Cargando usuarios...
        </div>
      </div>

    </section>


    <!-- ESTADOS -->

    <section class="section">

      <div class="sectionHeader">

        <h2>Estados</h2>

        <button
          class="refresh"
          onclick="loadStories()"
        >
          Actualizar
        </button>

      </div>

      <div
        id="stories"
        class="stories"
      >
        <div class="empty">
          Cargando estados...
        </div>
      </div>

    </section>


    <!-- MENSAJES -->

    <section class="section">

      <div class="sectionHeader">

        <h2>Últimos mensajes</h2>

        <button
          class="refresh"
          onclick="loadMessages()"
        >
          Actualizar
        </button>

      </div>

      <div
        id="messages"
        class="messages"
      >
        <div class="empty">
          Cargando mensajes...
        </div>

  </main>

</div>


<script>

let adminToken =
  localStorage.getItem(
    "michat_admin_token"
  ) || "";


/* =====================================================
   API
===================================================== */

async function api(
  url,
  options = {}
){

  options.headers =
    options.headers || {};

  if(adminToken){

    options.headers.Authorization =
      "Bearer " +
      adminToken;

  }

  if(
    options.body &&
    typeof options.body !== "string"
  ){

    options.headers["Content-Type"] =
      "application/json";

    options.body =
      JSON.stringify(
        options.body
      );

  }

  const response =
    await fetch(
      url,
      options
    );

  let data = {};

  try{
    data =
      await response.json();
  }catch{}

  if(
    response.status === 401
  ){

    adminToken = "";

    localStorage.removeItem(
      "michat_admin_token"
    );

    showLogin();

    throw new Error(
      "Sesión de administrador caducada."
    );

  }

  if(!response.ok){

    throw new Error(
      data.error ||
      "Error del servidor."
    );

  }

  return data;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const error =
    document
      .getElementById("loginError");

  error.textContent = "";

  if(
    !username ||
    !password
  ){

    error.textContent =
      "Escribe usuario y contraseña.";

    return;

  }

  try{

    const data =
      await api(
        "/api/admin/login",
        {
          method:"POST",
          body:{
            username,
            password
          }
        }
      );

    adminToken =
      data.token;

    localStorage.setItem(
      "michat_admin_token",
      adminToken
    );

    showAdmin();

  }catch(e){

    error.textContent =
      e.message ||
      "No se pudo iniciar sesión.";

  }

}


/* =====================================================
   SESIÓN
===================================================== */

async function checkSession(){

  if(!adminToken){

    showLogin();

    return;

  }

  try{

    await api(
      "/api/admin/me"
    );

    showAdmin();

  }catch{

    showLogin();

  }

}


/* =====================================================
   PANTALLAS
===================================================== */

function showLogin(){

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("adminScreen")
    .classList.add("hidden");

}

function showAdmin(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("adminScreen")
    .classList.remove("hidden");

  loadAll();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  try{

    await api(
      "/api/admin/logout",
      {
        method:"POST"
      }
    );

  }catch{}

  adminToken = "";

  localStorage.removeItem(
    "michat_admin_token"
  );

  showLogin();

}


/* =====================================================
   CARGAR TODO
===================================================== */

async function loadAll(){

  await Promise.all([
    loadStats(),
    loadUsers(),
    loadStories(),
    loadMessages()
  ]);

}


/* =====================================================
   ESTADÍSTICAS
===================================================== */

async function loadStats(){

  try{

    const data =
      await api(
        "/api/admin/stats"
      );

    document
      .getElementById("statUsers")
      .textContent =
        data.users || 0;

    document
      .getElementById("statMessages")
      .textContent =
        data.messages || 0;

    document
      .getElementById("statStories")
      .textContent =
        data.stories || 0;

    document
      .getElementById("statOnline")
      .textContent =
        data.online || 0;

  }catch(e){

    console.error(e);

  }

}


/* =====================================================
   USUARIOS
===================================================== */

async function loadUsers(){

  const container =
    document
      .getElementById("users");

  try{

    const list =
      await api(
        "/api/admin/users"
      );

    if(!list.length){

      container.innerHTML =
        '<div class="empty">No hay usuarios.</div>';

      return;

    }

    container.innerHTML =
      list
        .map(user => {

          const initial =
            escapeHtml(
              (
                user.displayName ||
                user.username ||
                "?"
              )[0]
            )
            .toUpperCase();

          const avatar =
            user.profileImage
              ? `<img class="avatar" src="${escapeAttr(user.profileImage)}">`
              : `<div class="avatarPlaceholder">${initial}</div>`;

          return `
            <div class="user">

              <div class="userLeft">

                ${avatar}

                <div>

                  <div class="userName">
                    ${escapeHtml(
                      user.displayName ||
                      user.username
                    )}
                  </div>

                  <div class="userUsername">
                    @${escapeHtml(
                      user.username
                    )}
                  </div>

                  <div class="${
                    user.online
                      ? "online"
                      : "offline"
                  }">

                    ${
                      user.online
                        ? "● Conectado"
                        : "● Desconectado"
                    }

                  </div>

                </div>

              </div>

              <div class="userActions">

                <button
                  class="actionButton"
                  onclick="showUserStories('${escapeJs(user.username)}')"
                >
                  Ver estados
                </button>

              </div>

            </div>
          `;

        })
        .join("");

  }catch(e){

    container.innerHTML =
      `<div class="empty">${escapeHtml(e.message)}</div>`;

  }

}


/* =====================================================
   ESTADOS
===================================================== */

async function loadStories(){

  const container =
    document
      .getElementById("stories");

  try{

    const list =
      await api(
        "/api/admin/stories"
      );

    renderStories(
      list
    );

  }catch(e){

    container.innerHTML =
      `<div class="empty">${escapeHtml(e.message)}</div>`;

  }

}


async function showUserStories(
  username
){

  const container =
    document
      .getElementById("stories");

  try{

    const list =
      await api(
        "/api/admin/users/" +
        encodeURIComponent(username) +
        "/stories"
      );

    renderStories(
      list,
      username
    );

    container
      .scrollIntoView({
        behavior:"smooth"
      });

  }catch(e){

    alert(
      e.message
    );

  }

}


function renderStories(
  list,
  usernameFilter = ""
){

  const container =
    document
      .getElementById("stories");

  if(!list.length){

    container.innerHTML =
      `<div class="empty">
        ${
          usernameFilter
            ? "Este usuario no tiene estados activos."
            : "No hay estados activos."
        }
      </div>`;

    return;

  }

  container.innerHTML =
    list
      .map(story => {

        let content = "";

        if(
          story.type === "image"
        ){

          content =
            `<img src="${escapeAttr(story.content)}">`;

        }else{

          content =
            `<div>${escapeHtml(story.content)}</div>`;

        }

        const date =
          story.createdAt
            ? new Date(
                story.createdAt
              ).toLocaleString()
            : "";

        return `
          <div class="story">

            <div
              class="storyContent"
              ${
                story.type === "text" &&
                story.background
                  ? `style="background:${escapeAttr(story.background)}"`
                  : ""
              }
            >

              ${content}

            </div>

            <div class="storyInfo">

              <div class="storyUser">
                ${escapeHtml(
                  story.displayName ||
                  story.username
                )}
              </div>

              <div class="storyDate">
                @${escapeHtml(
                  story.username
                )}
              </div>

              <div class="storyDate">
                ${escapeHtml(date)}
              </div>

              <div class="storyDate">
                ${
                  Array.isArray(story.views)
                    ? story.views.length
                    : 0
                } visualizaciones
              </div>

              <div class="storyButtons">

                <button
                  class="actionButton deleteButton"
                  onclick="deleteStory('${escapeJs(story.id)}')"
                >
                  Eliminar estado
                </button>

              </div>

            </div>

          </div>
        `;

      })
      .join("");

}


async function deleteStory(
  id
){

  if(
    !confirm(
      "¿Seguro que quieres eliminar este estado?"
    )
  ){

    return;

  }

  try{

    await api(
      "/api/admin/stories/" +
      encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );

    await Promise.all([
      loadStories(),
      loadStats()
    ]);

  }catch(e){

    alert(
      e.message
    );

  }

}


/* =====================================================
   MENSAJES
===================================================== */

async function loadMessages(){

  const container =
    document
      .getElementById("messages");

  try{

    const list =
      await api(
        "/api/admin/messages?limit=100"
      );

    if(!list.length){

      container.innerHTML =
        '<div class="empty">No hay mensajes.</div>';

      return;

    }

    container.innerHTML =
      list
        .slice()
        .reverse()
        .map(message => {

          const time =
            message.time
              ? new Date(
                  message.time
                ).toLocaleString()
              : "";

          return `
            <div class="message">

              <div class="messageTop">

                <div class="messageUsers">

                  ${escapeHtml(
                    message.fromDisplay ||
                    message.from
                  )}

                  →
                  
                  ${escapeHtml(
                    message.toDisplay ||
                    message.to
                  )}

                </div>

                <div class="messageTime">
                  ${escapeHtml(time)}
                </div>

              </div>

              <div class="messageText">

                ${escapeHtml(
                  message.message ||
                  ""
                )}

              </div>

            </div>
          `;

        })
        .join("");

  }catch(e){

    container.innerHTML =
      `<div class="empty">${escapeHtml(e.message)}</div>`;

  }

}


/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(
  value
){

  return escapeHtml(
    value
  );

}


function escapeJs(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n","\\n")
    .replaceAll("\r","\\r");

}


/* =====================================================
   ENTER PARA LOGIN
===================================================== */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        login();

      }

    }
  );


/* =====================================================
   INICIO
===================================================== */

checkSession();

</script>

</body>
</html>
