<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Chat - Administración</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#202124}header{background:#111827;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}header strong{font-size:20px}main{max-width:1200px;margin:22px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 2px 12px #00000012}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{padding:18px;border-radius:12px;background:#eef2ff}.stat b{display:block;font-size:14px;color:#4b5563;margin-bottom:7px}.stat span{font-size:28px;font-weight:bold}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:#e5e7eb;color:#111827}.tabs button.active{background:#111827;color:#fff}button{padding:9px 12px;border:0;border-radius:8px;background:#111827;color:#fff;cursor:pointer;margin:2px}button.secondary{background:#4b5563}button.danger{background:#b91c1c}button.small{font-size:12px;padding:7px 9px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap;vertical-align:middle}.online{color:#15803d;font-weight:bold}.offline{color:#777}.story{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:8px 0}.story img,.story video{max-width:180px;max-height:180px;border-radius:8px;display:block;margin:8px 0}.msg{padding:10px;margin:7px 0;border-radius:9px;background:#f3f4f6}.error{color:#b91c1c}.ok{color:#15803d}.muted{color:#6b7280;font-size:13px}.actions{white-space:normal}.search{max-width:350px;margin-bottom:10px}input{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;margin:5px 0 12px}label{font-weight:bold;font-size:14px}h2{margin-top:0}
</style>
</head>
<body>
<header><strong>Mi Chat · Administración</strong><button id="logout" class="secondary hidden">Cerrar sesión</button></header>
<main>
<section id="loginCard" class="card">
<h2>Acceso de administrador</h2>
<label>Usuario</label><input id="loginUser" autocomplete="username">
<label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password">
<button id="loginBtn">Entrar</button><div id="loginMsg"></div>
</section>
<section id="panel" class="hidden">
<div class="tabs">
<button data-tab="inicio" class="active">Inicio</button>
<button data-tab="usuarios">Usuarios</button>
<button data-tab="estados">Estados</button>
<button data-tab="mensajes">Mensajes</button>
</div>
<section id="tab-inicio" class="tab">
<div class="card"><h2>Resumen</h2><div class="grid" id="stats"></div><br><button id="refreshHome">Actualizar</button></div>
</section>
<section id="tab-usuarios" class="tab hidden">
<div class="card"><h2>Usuarios</h2><input id="userSearch" class="search" placeholder="Buscar usuario o nombre..."><button id="refreshUsers">Actualizar</button><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Estado</th><th>Contactos</th><th>Creado</th><th>Acciones</th></tr></thead><tbody id="users"></tbody></table></div><div id="actionMsg"></div></div>
</section>
<section id="tab-estados" class="tab hidden">
<div class="card"><h2>Estados</h2><button id="refreshStories">Actualizar</button><div id="stories"></div></div>
</section>
<section id="tab-mensajes" class="tab hidden">
<div class="card"><h2>Mensajes recientes</h2><button id="refreshMessages">Actualizar</button><div id="messages"></div></div>
</section>
</section>
</main>
<script>
const tokenKey='michat_admin_token';
const $=id=>document.getElementById(id);
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem(tokenKey)||'')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function showPanel(){ $('loginCard').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden');loadAll() }
function setTab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$('tab-'+name).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));if(name==='usuarios')loadUsers();if(name==='estados')loadStories();if(name==='mensajes')loadMessages()}
async function login(){const msg=$('loginMsg');msg.className='';msg.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo iniciar sesión');localStorage.setItem(tokenKey,d.token);showPanel()}catch(e){msg.className='error';msg.textContent=e.message}}
async function loadStats(){try{const s=await api('/api/admin/stats');$('stats').innerHTML=`<div class="stat"><b>Usuarios</b><span>${s.users}</span></div><div class="stat"><b>Mensajes</b><span>${s.messages}</span></div><div class="stat"><b>Estados</b><span>${s.stories}</span></div><div class="stat"><b>Conectados</b><span>${s.online}</span></div>`}catch(e){handleError(e)}}
let cachedUsers=[];
async function loadUsers(){try{cachedUsers=await api('/api/admin/users');renderUsers()}catch(e){handleError(e)}}
function renderUsers(){const q=$('userSearch').value.trim().toLowerCase();const list=cachedUsers.filter(u=>!q||String(u.username).toLowerCase().includes(q)||String(u.displayName).toLowerCase().includes(q));$('users').innerHTML=list.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.displayName)}</td><td class="${u.online?'online':'offline'}">${u.online?'● Online':'○ Offline'}</td><td>${u.contacts}</td><td>${u.createdAt?new Date(u.createdAt).toLocaleString('es-ES'):'-'}</td><td class="actions"><button class="small" onclick="viewUserStories('${escAttr(u.username)}')">Ver estados</button><button class="small" onclick="resetPassword('${escAttr(u.username)}')">Restablecer contraseña</button><button class="small danger" onclick="deleteUser('${escAttr(u.username)}')">Eliminar cuenta</button></td></tr>`).join('')||'<tr><td colspan="6">No hay usuarios.</td></tr>'}
async function viewUserStories(username){try{const list=await api('/api/admin/users/'+encodeURIComponent(username)+'/stories');alert(list.length?`Estados de ${username}: ${list.length}`:`${username} no tiene estados activos.`)}catch(e){handleError(e)}}
async function resetPassword(username){const p=prompt('Nueva contraseña para '+username+' (mínimo 6 caracteres):');if(p===null)return;if(p.length<6){alert('La contraseña debe tener al menos 6 caracteres.');return}if(!confirm('¿Restablecer la contraseña de '+username+'?'))return;try{await api('/api/admin/users/'+encodeURIComponent(username)+'/reset-password',{method:'POST',body:JSON.stringify({password:p})});$('actionMsg').className='ok';$('actionMsg').textContent='Contraseña restablecida para '+username+'.'}catch(e){$('actionMsg').className='error';$('actionMsg').textContent=e.message}}
async function deleteUser(username){if(!confirm('¿Eliminar DEFINITIVAMENTE la cuenta de '+username+'? También se eliminarán sus mensajes, estados, sesiones y tokens de notificaciones.'))return;if(!confirm('Esta acción no se puede deshacer. ¿Continuar?'))return;try{await api('/api/admin/users/'+encodeURIComponent(username),{method:'DELETE'});$('actionMsg').className='ok';$('actionMsg').textContent='Cuenta eliminada: '+username;await loadUsers();await loadStats()}catch(e){$('actionMsg').className='error';$('actionMsg').textContent=e.message}}
async function loadStories(){try{const list=await api('/api/admin/stories');$('stories').innerHTML=list.map(s=>{const media=s.image||s.media||s.url||'';let m='';if(media&&String(media).match(/\.(mp4|webm|ogg)(\?|$)/i))m=`<video src="${esc(media)}" controls></video>`;else if(media)m=`<img src="${esc(media)}" alt="Estado">`;return `<div class="story"><b>${esc(s.username||'')}</b><div class="muted">${s.createdAt?new Date(s.createdAt).toLocaleString('es-ES'):''}</div>${m}<div>${esc(s.text||s.caption||'')}</div><button class="danger small" onclick="deleteStory('${escAttr(String(s.id))}')">Eliminar estado</button></div>`}).join('')||'<p>No hay estados activos.</p>'}catch(e){handleError(e)}}
async function deleteStory(id){if(!confirm('¿Eliminar este estado?'))return;try{await api('/api/admin/stories/'+encodeURIComponent(id),{method:'DELETE'});loadStories();loadStats()}catch(e){handleError(e)}}
async function loadMessages(){try{const list=await api('/api/admin/messages?limit=500');$('messages').innerHTML=list.map(m=>`<div class="msg"><b>${esc(m.from||m.sender||'')} → ${esc(m.to||m.receiver||'')}</b><div>${esc(m.text||m.message||'')}</div><div class="muted">${m.createdAt||m.timestamp?new Date(m.createdAt||m.timestamp).toLocaleString('es-ES'):''}</div></div>`).join('')||'<p>No hay mensajes.</p>'}catch(e){handleError(e)}}
function handleError(e){if(String(e.message).includes('Sesión')){localStorage.removeItem(tokenKey);location.reload();return}alert(e.message)}
async function loadAll(){await loadStats();await loadUsers()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('loginBtn').onclick=login;$('refreshHome').onclick=loadStats;$('refreshUsers').onclick=loadUsers;$('refreshStories').onclick=loadStories;$('refreshMessages').onclick=loadMessages;$('userSearch').oninput=renderUsers;$('logout').onclick=()=>{localStorage.removeItem(tokenKey);location.reload()};$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
(async()=>{const t=localStorage.getItem(tokenKey);if(!t)return;try{await api('/api/admin/me');showPanel()}catch{localStorage.removeItem(tokenKey)}})();
</script>
</body>
</html>
