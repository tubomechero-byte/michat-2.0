<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Chat - Administración</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}header{background:#111827;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0001}input,button{padding:10px;border-radius:8px;border:1px solid #ccc}input{width:100%;box-sizing:border-box;margin:6px 0 12px}button{cursor:pointer;background:#111827;color:white;border:0;margin:3px}button.danger{background:#b91c1c}button.secondary{background:#4b5563}.hidden{display:none!important}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:14px;background:#eef2ff;border-radius:10px;min-width:130px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap}.online{color:#15803d;font-weight:bold}.offline{color:#777}.msg{margin-top:10px;padding:10px;border-radius:8px;background:#f3f4f6}.error{color:#b91c1c}.ok{color:#15803d}.terminal-card{background:#111827;color:#e5e7eb}.terminal{height:260px;overflow:auto;background:#030712;border-radius:10px;padding:12px;font-family:Consolas,Monaco,monospace;font-size:13px;box-sizing:border-box}.terminal-line{padding:4px 0;border-bottom:1px solid #1f2937;white-space:pre-wrap;word-break:break-word}.terminal-time{color:#9ca3af;margin-right:8px}.terminal-text{color:#f9fafb}.stories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.story-card{border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#fafafa}.story-media{width:100%;max-height:300px;object-fit:contain;border-radius:8px;background:#111827}.story-text{white-space:pre-wrap;word-break:break-word;padding:14px;background:#f3f4f6;border-radius:8px;min-height:80px}.story-meta{font-size:13px;color:#6b7280;margin:8px 0}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-box{background:#fff;border-radius:14px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:18px}.modal-box img,.modal-box video{max-width:100%;max-height:70vh;display:block;margin:auto}.close{float:right;background:#6b7280}.small{font-size:12px;color:#6b7280}
</style>
</head>
<body>
<header><strong>Mi Chat · Administración</strong><button id="logout" class="secondary hidden">Cerrar sesión</button></header>
<main>
<section id="loginCard" class="card">
<h2>Acceso de administrador</h2>
<label>Usuario</label><input id="loginUser" autocomplete="username">
<label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password">
<button id="loginBtn" type="button">Entrar</button><div id="loginMsg"></div>
</section>
<section id="panel" class="hidden">
<div class="card"><h2>Resumen</h2><div class="stats" id="stats"></div></div>
<div class="card terminal-card"><h2>Terminal de actividad</h2><div id="terminal" class="terminal"><div class="terminal-line">Mi Chat Admin iniciado. Esperando actividad...</div></div></div>
<div class="card"><h2>⚠️ Reportes</h2><button id="refreshReports">Actualizar reportes</button><div id="reportsMsg" class="msg"></div><div id="reports" class="stories-grid"></div></div>
<div class="card"><h2>Grabaciones de llamadas</h2><button id="refreshRecordings">Actualizar grabaciones</button><div id="recordingsMsg" class="msg"></div><div id="recordings" class="stories-grid"></div></div>
<div class="card"><h2>Estados</h2><button id="refreshStories">Actualizar estados</button><div id="storiesMsg" class="msg"></div><div id="stories" class="stories-grid"></div></div>
<div class="card"><h2>Usuarios</h2><button id="refresh">Actualizar</button><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Estado</th><th>Contactos</th><th>Acciones</th></tr></thead><tbody id="users"></tbody></table></div><div id="actionMsg"></div></div>
</section>
</main>
<div id="storyModal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeStoryModal()">Cerrar</button><h2 id="storyModalTitle">Estado</h2><div id="storyModalContent"></div></div></div>
<script>
const tokenKey='michat_admin_token';
const $=id=>document.getElementById(id);
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem(tokenKey)}}
function showPanel(){ $('loginCard').classList.add('hidden'); $('panel').classList.remove('hidden'); $('logout').classList.remove('hidden'); loadAll(); loadReports(); loadStories(); loadRecordings(); startActivity(); }
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function login(){const msg=$('loginMsg');msg.textContent='';try{const d=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});const j=await d.json();if(!d.ok)throw new Error(j.error||'No se pudo iniciar sesión');localStorage.setItem(tokenKey,j.token);showPanel()}catch(e){msg.className='error';msg.textContent=e.message}}
let activityTimer=null;
let activityIds=new Set();

function renderActivity(list){
  const terminal=$('terminal');
  if(!terminal)return;
  if(!list.length){
    terminal.innerHTML='<div class="terminal-line">Mi Chat Admin iniciado. Esperando actividad...</div>';
    return;
  }
  terminal.innerHTML=list.map(item=>{
    const d=new Date(item.time);
    const time=Number.isNaN(d.getTime())?'--:--:--':d.toLocaleTimeString('es-ES');
    return `<div class="terminal-line"><span class="terminal-time">[${esc(time)}]</span><span class="terminal-text">${esc(item.text)}</span></div>`;
  }).join('');
  terminal.scrollTop=terminal.scrollHeight;
}

async function loadActivity(){
  try{
    const list=await api('/api/admin/activity');
    renderActivity(list);
    list.forEach(x=>activityIds.add(x.id));
  }catch(e){}
}

function startActivity(){
  loadActivity();
  if(activityTimer)clearInterval(activityTimer);
  activityTimer=setInterval(loadActivity,1000);
}

async function loadAll(){try{const s=await api('/api/admin/stats');$('stats').innerHTML=`<div class="stat"><b>Usuarios</b><br>${s.users}</div><div class="stat"><b>Mensajes</b><br>${s.messages}</div><div class="stat"><b>Estados</b><br>${s.stories}</div><div class="stat"><b>Conectados</b><br>${s.online}</div>`;const list=await api('/api/admin/users');$('users').innerHTML=list.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.displayName)}</td><td class="${u.online?'online':'offline'}">${u.online?'● Online':'○ Offline'}</td><td>${u.contacts}</td><td><button onclick="resetPassword('${escAttr(u.username)}')">Restablecer contraseña</button><button class="danger" onclick="deleteUser('${escAttr(u.username)}')">Eliminar cuenta</button></td></tr>`).join('')}catch(e){if(e.message.includes('Sesión'))logout();else $('actionMsg').textContent=e.message}}
\nasync function loadReports(){\n  try{\n    const list=await api('/api/admin/reports');\n    const box=$('reports');\n    $('reportsMsg').className='msg';\n    $('reportsMsg').textContent=list.length?'':'No hay reportes.';\n    box.innerHTML=list.map(item=>{\n      const date=item.createdAt?new Date(Number(item.createdAt)).toLocaleString('es-ES'):'Fecha desconocida';\n      const status=item.status==='resolved'?'resolved':'open';\n      const statusText=status==='resolved'?'Resuelto':'Pendiente';\n      return `<div class="story-card"><b>⚠️ ${esc(item.category||'Otro')}</b><div class="story-meta">@${esc(item.username||'')} · ${esc(item.displayName||'')} · ${esc(date)} · <strong>${statusText}</strong></div><div class="story-text" style="white-space:pre-wrap">${esc(item.text||'')}</div><button onclick="toggleReport('${escAttr(String(item.id))}','${status}')">${status==='resolved'?'Marcar pendiente':'Marcar resuelto'}</button><button class="danger" onclick="deleteReport('${escAttr(String(item.id))}')">Eliminar</button></div>`;\n    }).join('');\n  }catch(e){$('reportsMsg').className='msg error';$('reportsMsg').textContent=e.message}\n}\nasync function toggleReport(id,status){\n  try{await api('/api/admin/reports/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:status==='resolved'?'open':'resolved'})});await loadReports();await loadAll();}catch(e){$('reportsMsg').className='msg error';$('reportsMsg').textContent=e.message}\n}\nasync function deleteReport(id){\n  if(!confirm('¿Eliminar este reporte definitivamente?'))return;\n  try{await api('/api/admin/reports/'+encodeURIComponent(id),{method:'DELETE'});await loadReports();await loadAll();}catch(e){$('reportsMsg').className='msg error';$('reportsMsg').textContent=e.message}\n}\n
async function loadRecordings(){
  try{
    const list=await api('/api/admin/recordings');
    const box=$('recordings');
    $('recordingsMsg').className='msg';
    $('recordingsMsg').textContent=list.length?'':'No hay grabaciones guardadas.';
    const adminToken=localStorage.getItem(tokenKey)||'';
    box.innerHTML=list.map(item=>{
      const date=item.createdAt?new Date(Number(item.createdAt)).toLocaleString('es-ES'):'Fecha desconocida';
      const mins=Math.floor(Number(item.duration||0)/60), secs=Number(item.duration||0)%60;
      const duration=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
      const size=(Number(item.size||0)/1024/1024).toFixed(2)+' MB';
      const src='/api/admin/recordings/'+encodeURIComponent(item.id)+'?token='+encodeURIComponent(adminToken);
      return `<div class="story-card"><b>📞 ${esc(item.fromDisplay||item.from)} → ${esc(item.toDisplay||item.to)}</b><div class="story-meta">${esc(date)} · ${esc(duration)} · ${esc(size)}</div><audio controls preload="none" src="${escAttr(src)}" style="width:100%"></audio><br><button class="danger" onclick="deleteRecording('${escAttr(String(item.id))}')">Eliminar</button></div>`;
    }).join('');
  }catch(e){$('recordingsMsg').className='msg error';$('recordingsMsg').textContent=e.message}
}

async function deleteRecording(id){
  if(!confirm('¿Eliminar definitivamente esta grabación?'))return;
  try{
    await api('/api/admin/recordings/'+encodeURIComponent(id),{method:'DELETE'});
    await loadRecordings();
  }catch(e){$('recordingsMsg').className='msg error';$('recordingsMsg').textContent=e.message}
}

async function loadStories(){try{const list=await api('/api/admin/stories');const box=$('stories');$('storiesMsg').textContent=list.length?'':'No hay estados activos.';box.innerHTML=list.map(story=>{const type=String(story.type||'text').toLowerCase();const user=esc(story.username||'');const created=story.createdAt?new Date(Number(story.createdAt)).toLocaleString('es-ES'):'Fecha desconocida';let media='';if(type==='image'){media=`<img class="story-media" src="${escAttr(story.content||'')}" alt="Estado">`}else if(type==='video'){media=`<video class="story-media" controls src="${escAttr(story.content||'')}"></video>`}else{media=`<div class="story-text">${esc(story.content||'')}</div>`}return `<div class="story-card"><b>@${user}</b><div class="story-meta">${esc(created)} · ${esc(type)}</div>${media}<button onclick="viewStory('${escAttr(String(story.id))}')">Ver</button><button class="danger" onclick="deleteStory('${escAttr(String(story.id))}')">Eliminar</button></div>`}).join('')}catch(e){$('storiesMsg').className='msg error';$('storiesMsg').textContent=e.message}}
async function viewStory(id){try{const list=await api('/api/admin/stories');const story=list.find(x=>String(x.id)===String(id));if(!story)throw new Error('Estado no encontrado.');$('storyModalTitle').textContent='Estado de @'+(story.username||'');const type=String(story.type||'text').toLowerCase();let html='';if(type==='image')html=`<img src="${escAttr(story.content||'')}" alt="Estado">`;else if(type==='video')html=`<video controls src="${escAttr(story.content||'')}"></video>`;else html=`<div class="story-text">${esc(story.content||'')}</div>`;$('storyModalContent').innerHTML=html+'<p class="small">'+esc(story.createdAt?new Date(Number(story.createdAt)).toLocaleString('es-ES'):'')+'</p>';$('storyModal').classList.remove('hidden')}catch(e){alert(e.message)}}
function closeStoryModal(){$('storyModal').classList.add('hidden');$('storyModalContent').innerHTML=''}
async function deleteStory(id){if(!confirm('¿Eliminar este estado definitivamente?'))return;try{await api('/api/admin/stories/'+encodeURIComponent(id),{method:'DELETE'});$('storiesMsg').className='msg ok';$('storiesMsg').textContent='Estado eliminado.';await loadStories();await loadAll()}catch(e){$('storiesMsg').className='msg error';$('storiesMsg').textContent=e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function resetPassword(username){const p=prompt('Nueva contraseña para '+username+' (mínimo 6 caracteres):');if(p===null)return;if(p.length<6){alert('La contraseña debe tener al menos 6 caracteres.');return}if(!confirm('¿Restablecer la contraseña de '+username+'?'))return;try{await api('/api/admin/users/'+encodeURIComponent(username)+'/reset-password',{method:'POST',body:JSON.stringify({password:p})});$('actionMsg').className='ok';$('actionMsg').textContent='Contraseña restablecida para '+username+'.'}catch(e){$('actionMsg').className='error';$('actionMsg').textContent=e.message}}
async function deleteUser(username){if(!confirm('¿Eliminar DEFINITIVAMENTE la cuenta de '+username+'? También se eliminarán sus mensajes, estados, sesiones y tokens de notificaciones.'))return;if(!confirm('Esta acción no se puede deshacer. ¿Continuar?'))return;try{await api('/api/admin/users/'+encodeURIComponent(username),{method:'DELETE'});$('actionMsg').className='ok';$('actionMsg').textContent='Cuenta eliminada: '+username;loadAll()}catch(e){$('actionMsg').className='error';$('actionMsg').textContent=e.message}}
async function check(){const t=localStorage.getItem(tokenKey);if(!t)return;if(t)try{await api('/api/admin/me');showPanel();startActivity()}catch{localStorage.removeItem(tokenKey)}}
$('loginBtn').onclick = async function (event) {
  event.preventDefault();
  try {
    await login();
  } catch (err) {
    console.error('Error al iniciar sesión:', err);
    const msg = $('loginMsg');
    if (msg) {
      msg.textContent = err?.message || 'No se pudo iniciar sesión.';
      msg.style.display = 'block';
    }
  }
};$('refresh').onclick=loadAll;$('refreshReports').onclick=loadReports;$('refreshStories').onclick=loadStories;$('refreshRecordings').onclick=loadRecordings;$('logout').onclick=()=>{localStorage.removeItem(tokenKey);location.reload()};$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});check();
</script>
</body>
</html>
