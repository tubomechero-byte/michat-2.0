<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Chat Admin</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0001}input,button{padding:11px;border-radius:9px;border:1px solid #ccc;font-size:15px}button{cursor:pointer;background:#111;color:#fff}.login{max-width:400px;margin:70px auto}.row{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:180px}.hidden{display:none}.error{color:#b00020}.user,.story,.msg{border-top:1px solid #eee;padding:12px 0}.online{color:green;font-weight:bold}.offline{color:#777}.thumb{max-width:120px;max-height:120px;border-radius:8px;margin-top:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div id="login" class="login card">
<h1>Mi Chat Admin</h1>
<p>Acceso de administrador</p>
<input id="user" placeholder="Usuario" style="width:100%;box-sizing:border-box"><br><br>
<input id="pass" type="password" placeholder="Contraseña" style="width:100%;box-sizing:border-box"><br><br>
<button onclick="login()" style="width:100%">Entrar</button>
<p id="loginError" class="error"></p>
</div>
<div id="app" class="hidden"><div class="wrap">
<div class="row" style="justify-content:space-between;align-items:center"><h1>Mi Chat Admin</h1><button onclick="logout()">Cerrar sesión</button></div>
<div id="stats" class="row"></div>
<div class="card"><h2>Usuarios</h2><div id="users">Cargando...</div></div>
<div class="card"><h2>Estados</h2><div id="stories">Cargando...</div></div>
<div class="card"><h2>Mensajes recientes</h2><div id="messages">Cargando...</div></div>
</div></div>
<script>
const KEY='michat_admin_token';
const token=()=>localStorage.getItem(KEY)||'';
async function api(url,opt={}){opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token()},opt.headers||{});const r=await fetch(url,opt);if(r.status===401){localStorage.removeItem(KEY);showLogin();throw new Error('Sesión caducada');}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function showLogin(){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}
async function login(){const e=document.getElementById('loginError');e.textContent='';try{const d=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});const j=await d.json();if(!d.ok)throw new Error(j.error||'Error');localStorage.setItem(KEY,j.token);await load();showApp()}catch(x){e.textContent=x.message}}
async function logout(){localStorage.removeItem(KEY);showLogin()}
async function load(){const [s,u,st,m]=await Promise.all([api('/api/admin/stats'),api('/api/admin/users'),api('/api/admin/stories'),api('/api/admin/messages?limit=100')]);document.getElementById('stats').innerHTML=`<div class="card stat"><b>Usuarios</b><h2>${s.users}</h2></div><div class="card stat"><b>En línea</b><h2>${s.online}</h2></div><div class="card stat"><b>Mensajes</b><h2>${s.messages}</h2></div><div class="card stat"><b>Estados</b><h2>${s.stories}</h2></div>`;document.getElementById('users').innerHTML=u.length?u.map(x=>`<div class="user"><b>${esc(x.displayName)}</b> (@${esc(x.username)}) — <span class="${x.online?'online':'offline'}">${x.online?'En línea':'Desconectado'}</span> — contactos: ${x.contacts}<br><button onclick="userStories('${encodeURIComponent(x.username)}')">Ver estados</button></div>`).join(''):'No hay usuarios';renderStories(st);document.getElementById('messages').innerHTML=m.length?m.map(x=>`<div class="msg"><b>${esc(x.fromDisplay||x.from||'')}</b> → <b>${esc(x.toDisplay||x.to||'')}</b><br>${esc(x.message||'')}<br><small>${esc(x.time||'')}</small></div>`).join(''):'No hay mensajes'}
function renderStories(a){document.getElementById('stories').innerHTML=a.length?a.map(x=>`<div class="story"><b>${esc(x.displayName||x.username)}</b> — ${esc(x.type||'')} — ${new Date(Number(x.createdAt||Date.now())).toLocaleString()}<br>${x.type==='image'&&x.content?`<img class="thumb" src="${x.content}">`:''}<br><button onclick="delStory('${encodeURIComponent(String(x.id))}')">Eliminar estado</button></div>`).join(''):'No hay estados activos'}
async function delStory(id){if(!confirm('¿Eliminar este estado?'))return;await api('/api/admin/stories/'+id,{method:'DELETE'});load()}
async function userStories(u){try{const a=await api('/api/admin/users/'+u+'/stories');alert(a.length?'El usuario tiene '+a.length+' estado(s) activo(s).':'El usuario no tiene estados activos.')}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{if(!token()){showLogin();return}try{await api('/api/admin/me');await load();showApp()}catch(e){showLogin()}})();
</script>
</body></html>
