<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Chat - Administración</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}header{background:#111827;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0001}input,button{padding:10px;border-radius:8px;border:1px solid #ccc}input{width:100%;box-sizing:border-box;margin:6px 0 12px}button{cursor:pointer;background:#111827;color:white;border:0;margin:3px}button.danger{background:#b91c1c}button.secondary{background:#4b5563}.hidden{display:none}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:14px;background:#eef2ff;border-radius:10px;min-width:130px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap}.online{color:#15803d;font-weight:bold}.offline{color:#777}.msg{margin-top:10px;padding:10px;border-radius:8px;background:#f3f4f6}.error{color:#b91c1c}.ok{color:#15803d}
</style>
</head>
<body>
<header><strong>Mi Chat · Administración</strong><button id="logout" class="secondary hidden">Cerrar sesión</button></header>
<main>
<section id="loginCard" class="card">
<h2>Acceso de administrador</h2>
<label>Usuario</label><input id="loginUser" autocomplete="username">
<label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password">
<button id="loginBtn">Entrar</button><div id="loginMsg"></div>
</section>
<section id="panel" class="hidden">
<div class="card"><h2>Resumen</h2><div class="stats" id="stats"></div></div>
<div class="card"><h2>Usuarios</h2><button id="refresh">Actualizar</button><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Estado</th><th>Contactos</th><th>Acciones</th></tr></thead><tbody id="users"></tbody></table></div><div id="actionMsg"></div></div>
</section>
</main>
<script>
const tokenKey='michat_admin_token';
const $=id=>document.getElementById(id);
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem(tokenKey)}}
function showPanel(){ $('loginCard').classList.add('hidden'); $('panel').classList.remove('hidden'); $('logout').classList.remove('hidden'); loadAll(); }
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function login(){const msg=$('loginMsg');msg.textContent='';try{const d=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});const j=await d.json();if(!d.ok)throw new Error(j.error||'No se pudo iniciar sesión');localStorage.setItem(tokenKey,j.token);showPanel()}catch(e){msg.className='error';msg.textContent=e.message}}
async function loadAll(){try{const s=await api('/api/admin/stats');$('stats').innerHTML=`<div class="stat"><b>Usuarios</b><br>${s.users}</div><div class="stat"><b>Mensajes</b><br>${s.messages}</div><div class="stat"><b>Estados</b><br>${s.stories}</div><div class="stat"><b>Conectados</b><br>${s.online}</div>`;const list=await api('/api/admin/users');$('users').innerHTML=list.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.displayName)}</td><td class="${u.online?'online':'offline'}">${u.online?'● Online':'○ Offline'}</td><td>${u.contacts}</td><td><button onclick="resetPassword('${escAttr(u.username)}')">Restablecer contraseña</button><button class="danger" onclick="deleteUser('${escAttr(u.username)}')">Eliminar cuenta</button></td></tr>`).join('')}catch(e){if(e.message.includes('Sesión'))logout();else $('actionMsg').textContent=e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function resetPassword(username){const p=prompt('Nueva contraseña para '+username+' (mínimo 6 caracteres):');if(p===null)return;if(p.length<6){alert('La contraseña debe tener al menos 6 caracteres.');return}if(!confirm('¿Restablecer la contraseña de '+username+'?'))return;try{await api('/api/admin/users/'+encodeURIComponent(username)+'/reset-password',{method:'POST',body:JSON.stringify({password:p})});$('actionMsg').className='ok';$('actionMsg').textContent='Contraseña restablecida para '+username+'.'}catch(e){$('actionMsg').className='error';$('actionMsg').textContent=e.message}}
async function deleteUser(username){if(!confirm('¿Eliminar DEFINITIVAMENTE la cuenta de '+username+'? También se eliminarán sus mensajes, estados, sesiones y tokens de notificaciones.'))return;if(!confirm('Esta acción no se puede deshacer. ¿Continuar?'))return;try{await api('/api/admin/users/'+encodeURIComponent(username),{method:'DELETE'});$('actionMsg').className='ok';$('actionMsg').textContent='Cuenta eliminada: '+username;loadAll()}catch(e){$('actionMsg').className='error';$('actionMsg').textContent=e.message}}
async function check(){const t=localStorage.getItem(tokenKey);if(!t)return;if(t)try{await api('/api/admin/me');showPanel()}catch{localStorage.removeItem(tokenKey)}}
$('loginBtn').onclick=login;$('refresh').onclick=loadAll;$('logout').onclick=()=>{localStorage.removeItem(tokenKey);location.reload()};$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});check();
</script>
</body>
</html>
